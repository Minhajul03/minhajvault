services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: unless-stopped

    ports:
      - "8200:8200"

    cap_add:
      - IPC_LOCK

    command: vault server -config=/vault/config/vault.hcl

    volumes:
      - /home/minhaj/work/workPrevious/minhajvault/vault-data:/vault/data
      - /home/minhaj/work/workPrevious/minhajvault/vault-config:/vault/config:ro
